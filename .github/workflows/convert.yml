name: 转换 MRS 规则
on:
  push:
    branches:
      - main
    paths:
      - 'rules/text/**'
  workflow_dispatch:  # 允许手动触发
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      # ========== 1. 拉取远端规则写入本地txt ==========
      - name: 拉取远端 domain/ipcidr 规则
        run: |
          set -e
          mkdir -p rules/text
          
          # jsdelivr CDN 稳定源，规避ghproxy失效问题
          RAW_DOMAIN="https://cdn.jsdelivr.net/gh/QuixoticHeart/rule-set@ruleset/ruleset/meta/domain/proxy.list"
          RAW_IPCIDR="https://cdn.jsdelivr.net/gh/QuixoticHeart/rule-set@ruleset/ruleset/meta/ipcidr/proxy.list"

          download_rule() {
            local url=$1
            local save=$2
            local retry=3
            for ((i=1; i<=retry; i++)); do
              echo "第 $i 次下载 $url -> $save"
              if curl -L --connect-timeout 90 "$url" -o "$save.tmp" && [ -s "$save.tmp" ]; then
                mv "$save.tmp" "$save"
                echo "✅ $save 更新完成"
                return 0
              fi
              rm -f "$save.tmp"
              sleep 3
            done
            echo "❌ $save 下载失败"
            return 1
          }

          # 下载两个规则文本
          download_rule "$RAW_DOMAIN" "rules/text/domain.txt"
          download_rule "$RAW_IPCIDR" "rules/text/ipcidr.txt"

          # 校验至少存在一个文件
          if [ ! -f rules/text/domain.txt ] && [ ! -f rules/text/ipcidr.txt ]; then
            echo "❌ 两个规则文件全部下载失败，终止任务"
            exit 1
          fi

          ls -lh rules/text/

      # ========== 2. 先提交推送更新后的 txt 文件（关键改动） ==========
      - name: 提交并推送更新后的原始规则txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}

          git add rules/text/
          if git diff --cached --quiet; then
            echo "✅ 远端规则无变化，跳过推送"
          else
            git commit -m "🤖 更新远端 domain/ipcidr 原始规则 $(date '+%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin main
            echo "✅ 原始规则txt已推送至仓库，源码已更新"
          fi

      # ========== 3. 重新拉取最新代码，确保使用刚推送的txt进行转换 ==========
      - name: 同步最新仓库代码
        run: |
          git pull origin main
          ls -lh rules/text/

      # ========== 4. 下载 Mihomo 转换工具 ==========
      - name: 下载 Mihomo
        run: |
          set -e
          echo "📥 获取最新版本信息..."
          LATEST_VERSION=$(curl -sL --max-time 30 https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name')
          
          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
            echo "❌ 无法获取版本信息，使用固定版本"
            LATEST_VERSION="v1.18.10"
          fi
          
          echo "✅ 版本: $LATEST_VERSION"
          DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_VERSION}/mihomo-linux-amd64-${LATEST_VERSION}.gz"
          echo "📦 下载地址: $DOWNLOAD_URL"
          
          for i in {1..3}; do
            echo "⏳ 尝试下载 (第 $i 次)..."
            if wget --timeout=60 --tries=3 --show-progress "$DOWNLOAD_URL"; then
              echo "✅ 下载成功"
              break
            else
              echo "⚠️ 下载失败，等待重试..."
              sleep 5
            fi
            if [ $i -eq 3 ]; then
              echo "❌ 下载失败，尝试备用源..."
              MIRROR_URL="https://mirror.ghproxy.com/${DOWNLOAD_URL}"
              wget --timeout=60 --show-progress "$MIRROR_URL"
            fi
          done
          
          gunzip "mihomo-linux-amd64-${LATEST_VERSION}.gz"
          mv "mihomo-linux-amd64-${LATEST_VERSION}" mihomo
          chmod +x mihomo
          ./mihomo -v 2>/dev/null || echo "✅ mihomo 已就绪"
      
      # ========== 5. 执行 MRS 转换 ==========
      - name: 创建输出目录
        run: |
          mkdir -p rules/mrs
      
      - name: 转换规则文件
        run: |
          for txt_file in rules/text/*.txt; do
            if [ -f "$txt_file" ]; then
              filename=$(basename "$txt_file" .txt)
              echo "正在转换: $filename"
              case "$filename" in
                domain|domain_suffix|domain_keyword)
                  behavior="domain"
                  ;;
                ipcidr|ip_cidr|ipcidr6)
                  behavior="ipcidr"
                  ;;
                classical|mixed)
                  behavior="classical"
                  ;;
                *)
                  behavior="domain"
                  ;;
              esac
              ./mihomo convert-ruleset "$behavior" text "$txt_file" "rules/mrs/${filename}.mrs"
              if [ $? -eq 0 ]; then
                echo "✅ ${filename}.mrs 转换成功"
                ls -lh "rules/mrs/${filename}.mrs"
              else
                echo "❌ ${filename}.mrs 转换失败"
              fi
            fi
          done
      
      # ========== 6. 生成mrs列表README ==========
      - name: 生成规则列表
        run: |
          echo "# 可用规则" > rules/mrs/README.md
          echo "" >> rules/mrs/README.md
          echo "生成时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> rules/mrs/README.md
          echo "" >> rules/mrs/README.md
          echo "| 文件名 | 大小 | 下载链接 |" >> rules/mrs/README.md
          echo "|--------|------|----------|" >> rules/mrs/README.md
          
          for mrs_file in rules/mrs/*.mrs; do
            if [ -f "$mrs_file" ]; then
              filename=$(basename "$mrs_file")
              filesize=$(ls -lh "$mrs_file" | awk '{print $5}')
              echo "| $filename | $filesize | [下载](https://github.com/${{ github.repository }}/releases/latest/download/$filename) |" >> rules/mrs/README.md
            fi
          done

      # ========== 7. 提交转换后的mrs产物 ==========
      - name: 设置 .gitignore
        run: |
          if [ ! -f .gitignore ]; then
            echo "mihomo" > .gitignore
            echo "/mihomo" >> .gitignore
          else
            grep -q "^mihomo$" .gitignore || echo "mihomo" >> .gitignore
            grep -q "^/mihomo$" .gitignore || echo "/mihomo" >> .gitignore
          fi
          cat .gitignore
      
      - name: 提交转换后的MRS结果
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          rm -f mihomo
          
          git add rules/mrs/
          if git diff --cached --quiet; then
            echo "✅ MRS文件无变更，跳过提交"
            exit 0
          fi
          
          git commit -m "🤖 转换MRS规则 $(date '+%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin main
          git push origin main
          echo "✅ MRS转换结果推送完成"
        
      # ========== 8. 创建Release上传mrs文件 ==========
      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: MRS Rules v${{ github.run_number }}
          delete_tag: true
          body: |
            🎉 同步远端原始规则并生成 MRS 规则集
            
            **生成时间**: ${{ github.event.head_commit.timestamp }}
            **提交信息**: ${{ github.event.head_commit.message }}
            
            ## 📥 使用方法
            ```yaml
            rule-providers:
              my-domain:
                type: http
                behavior: domain
                format: mrs
                url: "https://github.com/${{ github.repository }}/releases/latest/download/domain.mrs"
                interval: 86400
              my-ipcidr:
                type: http
                behavior: ipcidr
                format: mrs
                url: "https://github.com/${{ github.repository }}/releases/latest/download/ipcidr.mrs"
                interval: 86400